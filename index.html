<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Direct Refer — the referral network connecting students, professionals and recruiters. Get referred into top companies." />
    <meta name="theme-color" content="#0B0F14" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Direct Refer — Get Referred, Get Hired" />
    <meta property="og:description" content="Connect with verified professionals who refer you into the world's best companies. Track referrals, message professionals, and land your dream role." />
    <meta property="og:url" content="https://directrefer.in" />
    <meta property="og:image" content="https://directrefer.in/og-image.png" />
    <meta property="og:site_name" content="Direct Refer" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Direct Refer — Get Referred, Get Hired" />
    <meta name="twitter:description" content="Connect with verified professionals who refer you into the world's best companies." />
    <meta name="twitter:image" content="https://directrefer.in/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://directrefer.in" />

    <title>Direct Refer — Get Referred, Get Hired</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Direct Refer",
      "url": "https://directrefer.app",
      "description": "Connect with verified professionals who refer you into the world's best companies.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "creator": {
        "@type": "Organization",
        "name": "Direct Refer, Inc.",
        "url": "https://directrefer.app"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
