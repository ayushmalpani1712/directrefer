<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Direct Refer — request referrals from verified professionals at top companies. Find the right opportunity and track your referral pipeline." />
    <meta name="theme-color" content="#0A0A0F" />
    <meta name="theme-color" content="#0A0A0F" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="index, follow" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DirectRefer" />

    <!-- Android / Chrome PWA -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Windows -->
    <meta name="msapplication-TileColor" content="#0A0A0F" />
    <meta name="msapplication-TileImage" content="/logo-emblem.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo-emblem.png" />
    <link rel="apple-touch-icon" href="/logo-emblem.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Direct Refer — Get Referred by Verified Professionals" />
    <meta property="og:description" content="Find the right opportunity and request a referral from a verified professional at top companies. Track your referral pipeline instead of cold-applying." />
    <meta property="og:url" content="https://www.directrefer.in" />
    <meta property="og:image" content="https://www.directrefer.in/og-image.png" />
    <meta property="og:site_name" content="Direct Refer" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Direct Refer — Get Referred by Verified Professionals" />
    <meta name="twitter:description" content="Find the right opportunity and request a referral from a verified professional at top companies." />
    <meta name="twitter:image" content="https://www.directrefer.in/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.directrefer.in" />

    <!-- DNS Prefetch for critical origins -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <title>Direct Refer — Get Referred by Verified Professionals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Direct Refer",
      "url": "https://www.directrefer.in",
      "description": "Find the right opportunity and request a referral from a verified professional at top companies.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "creator": {
        "@type": "Organization",
        "name": "Direct Refer, Inc.",
        "url": "https://www.directrefer.in"
      }
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Direct Refer.</noscript>
    <div id="root" style="overflow-x: hidden;"></div>
    <script>
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('SW registered:', reg.scope);
          }).catch(function(err) {
            console.log('SW registration failed:', err);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
