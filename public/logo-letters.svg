<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Blue "d" letter -->
  <g>
    <!-- Bowl of d (circle on left) -->
    <path d="M 310 160 C 240 160 180 220 180 310 C 180 400 240 460 310 460 L 310 370 C 280 370 260 350 260 310 C 260 270 280 250 310 250 Z" fill="#3B5FE5"/>
