<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Blue "d" letter: circular bowl + vertical stem -->
  <circle cx="200" cy="280" r="105" fill="#3B5FE5"/>
  <circle cx="200" cy="280" r="60" fill="#0a0a1a"/>
  <rect x="278" y="78" width="34" height="380" rx="2" fill="#3B5FE5"/>

  <!-- Purple "r" arrow shaft: flows from bottom-left of bowl, curves up through bowl, exits upper-right -->
  <path d="M 145 370 C 140 290 175 195 310 120" stroke="#8B8FD4" stroke-width="54" stroke-linecap="round" fill="none"/>
  <!-- Arrowhead triangle pointing upper-right -->
  <path d="M 358 55 L 415 95 L 352 135 Z" fill="#8B8FD4"/>
</svg>
