<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ag" x1="20%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#8B8FD4"/>
      <stop offset="100%" stop-color="#b0b8d8"/>
    </linearGradient>
  </defs>

  <!-- Blue "d" letter (drawn first, behind arrow) -->
  <g>
    <!-- Full d outline: stem + bowl -->
    <path d="M 300 80 L 300 432 Q 300 480 260 480 L 240 480 Q 180 480 160 420 Q 140 360 140 300 Q 140 200 190 140 Q 230 80 300 80 Z" fill="#3B5FE5"/>
    <!-- Bowl inner cutout -->
    <ellipse cx="220" cy="300" rx="70" ry="90" fill="#0a0a1a"/>
  </g>

  <!-- Arrow (drawn on top, passes over d stem) -->
  <g>
    <!-- Arrow body - curves from inside bowl upward-right -->
    <path d="M 215 290 C 215 210 280 155 360 130" stroke="url(#ag)" stroke-width="52" stroke-linecap="round" fill="none"/>
    <!-- Arrowhead pointing upper-right -->
    <path d="M 330 78 L 405 120 L 330 168" stroke="url(#ag)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
